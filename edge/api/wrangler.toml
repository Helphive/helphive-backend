# Deployed by Cloudflare Workers Builds on every push to main that changes edge/api (root /edge/api, no build step,
# build variable SKIP_DEPENDENCY_INSTALL=1, deploy npx -y wrangler@4 deploy). Backend Cloud Build ignores edge/**.
# The secret is set once with: npx wrangler@4 secret put ORIGIN_AUTH (same value as ORIGIN_AUTH in helphive-secrets)
name = "helphive-api-edge"
main = "index.js"
compatibility_date = "2026-11-01"
account_id = "803b01a6e3e53ef41f175e2a54e51372"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.helphive.himaiz.com", custom_domain = true }]

[vars]
ORIGIN = "https://helphive-backend-sjzzjsey3a-uc.a.run.app"

[observability]
enabled = true
